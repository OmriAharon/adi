name: Deploy to Firebase Hosting

# master        → live site (adigoldshtein.com)
# other branches → preview channel (private URL, noindex), shown as a notice on the run
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build static site
        run: npm run build
        env:
          PREVIEW: ${{ github.ref != 'refs/heads/master' && '1' || '' }}
      - name: Deploy
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ADIAPP_D1B5E }}
          FORCE_COLOR: '0'
          NO_COLOR: '1'
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_ADIAPP_D1B5E is not set"
            exit 1
          fi
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            target="deploy --only hosting"
          else
            target="hosting:channel:deploy preview --expires 30d"
          fi
          set +e
          npx --yes firebase-tools@latest $target --project adiapp-d1b5e --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          rm -f "$RUNNER_TEMP/sa.json"
          if [ "$status" -ne 0 ]; then
            # Surface Firebase's actual error as annotations, visible on the run summary page.
            sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/deploy.log" \
              | grep -E '^Error|\[apiv2\]\[status\].* [45][0-9][0-9]|"message"' \
              | grep -v 'Error Context' | tail -8 | cut -c1-600 \
              | sed -e 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line}"; done
            exit "$status"
          fi
          url=$(grep -oE 'https://adiapp-d1b5e--preview-[a-z0-9-]+\.web\.app' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -n "$url" ]; then
            echo "::notice title=Preview URL::$url"
            echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
